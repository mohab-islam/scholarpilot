name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Backend tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend and extension syntax check
        run: |
          for f in frontend/*.js extension/*.js; do node --check "$f"; done
      - name: Docker image builds
        run: docker build -t scholarpilot .
